spring.application.name=block-file-extensions

# Local development reads the repository root .env. A backend-local .env may
# override it. On EC2, inject the same variables from GitHub Actions Secrets.
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# Server
server.port=${SERVER_PORT:8080}

# MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/file_guard?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:file_guard}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Upload limits
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}
app.upload.directory=${UPLOAD_DIR:./uploads}

# ClamAV
app.clamav.host=${CLAMAV_HOST:localhost}
app.clamav.port=${CLAMAV_PORT:3310}
app.clamav.timeout=${CLAMAV_TIMEOUT:10000}

# Frontend / CORS
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Actuator: only health and info are exposed publicly.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
